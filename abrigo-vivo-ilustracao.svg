<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" role="img" aria-labelledby="av-t av-d">
<title id="av-t">Abrigo Vivo em corte lateral</title>
<desc id="av-d">Casinha-abrigo para morcegos presa a um poste, mostrada em corte. No topo, um compartimento vedado com a Raspberry Pi, a câmera NoIR e LEDs infravermelhos olhando para a fresta central. Embaixo, frestas de cerca de 2 cm com morcegos pendurados, uma barreira infravermelha dupla na entrada e a tábua de pouso. Na frente, um difusor de essência vegetal. No poste, o painel solar e a bateria numa caixa separada, longe dos morcegos.</desc>
<style>
.av-sky{fill:var(--sky,#142334)}
.av-moon{fill:var(--moon,#efe9cf)}
.av-tree{fill:var(--leaf,#6fa784);opacity:.16}
.av-wood{fill:var(--wood,#b4825a)}
.av-woodd{fill:var(--wood-dark,#86603f)}
.av-groove{stroke:var(--wood-dark,#86603f);stroke-width:2}
.av-inside{fill:var(--cavity,#24190f)}
.av-box{fill:var(--box,#3a4440)}
.av-pi{fill:var(--chip,#3f9a58)}
.av-batt{fill:var(--battery,#d0a63a)}
.av-cam{fill:var(--cam,#050505)}
.av-lens{fill:var(--lens,#7ea2c8)}
.av-led{fill:var(--ir,#ff5a4a)}
.av-cone{fill:var(--ir,#ff5a4a);opacity:.12}
.av-bat{fill:var(--bat,#07080b);stroke:var(--bat-rim,#8796ad);stroke-width:1;stroke-linejoin:round}
.av-ir{stroke:var(--ir,#ff5a4a);stroke-width:2.5;stroke-dasharray:6 5;fill:none}
.av-lead{stroke:var(--muted,#a9b5ad);stroke-width:1.2;fill:none}
.av-dot{fill:var(--muted,#a9b5ad)}
.av-lbl{font:700 15px 'Atkinson Hyperlegible',system-ui,sans-serif;fill:var(--ink,#e7ece4)}
.av-sub{font:400 13px 'Atkinson Hyperlegible',system-ui,sans-serif;fill:var(--muted,#a9b5ad)}
.av-panel{fill:var(--panel,#2c4560)}
.av-cell{stroke:var(--panel-line,#8fb0d2);stroke-width:1}
.av-scent{stroke:var(--accent,#e597bd);stroke-width:2;fill:none;stroke-linecap:round}
.av-vial{fill:var(--accent,#e597bd)}
.av-cable{stroke:var(--ink,#e7ece4);stroke-width:1.5;fill:none;stroke-dasharray:2 4;opacity:.45}
.av-num{display:none}
.av-num circle{fill:var(--ink,#e7ece4)}
.av-num text{font:700 15px 'Atkinson Hyperlegible',system-ui,sans-serif;fill:var(--sky,#142334);text-anchor:middle;dominant-baseline:central}
</style>
<defs>
  <g id="av-hang">
    <ellipse cx="0" cy="0" rx="7" ry="14"/>
    <circle cx="0" cy="14" r="6"/>
    <polygon points="-5,17 -4,24 -1,19"/>
    <polygon points="5,17 4,24 1,19"/>
    <rect x="-1" y="-19" width="2" height="6"/>
  </g>
  <path id="av-fly" d="M0 -4 L3 -10 L4 -4 Q12 -11 27 -8 Q22 -4 23 1 Q17 -1 14 3 Q10 0 6 4 Q3 2 0 7 Q-3 2 -6 4 Q-10 0 -14 3 Q-17 -1 -23 1 Q-22 -4 -27 -8 Q-12 -11 -4 -4 L-3 -10 Z"/>
</defs>

<rect class="av-sky" x="0" y="0" width="860" height="640" rx="20"/>
<circle class="av-moon" cx="110" cy="88" r="34"/>
<ellipse class="av-tree" cx="40" cy="610" rx="150" ry="95"/>
<ellipse class="av-tree" cx="230" cy="640" rx="130" ry="55"/>
<ellipse class="av-tree" cx="820" cy="620" rx="160" ry="80"/>

<!-- poste, painel solar e bateria -->
<rect class="av-woodd" x="446" y="80" width="22" height="560"/>
<rect class="av-woodd" x="457" y="88" width="70" height="7"/>
<polygon class="av-panel" points="500,40 640,70 630,110 490,80"/>
<line class="av-cell" x1="535" y1="47.5" x2="525" y2="87.5"/>
<line class="av-cell" x1="570" y1="55" x2="560" y2="95"/>
<line class="av-cell" x1="605" y1="62.5" x2="595" y2="102.5"/>
<line class="av-cell" x1="495" y1="60" x2="635" y2="90"/>
<rect class="av-box" x="468" y="538" width="50" height="38" rx="4"/>
<rect class="av-batt" x="476" y="546" width="34" height="22" rx="3"/>
<path class="av-cable" d="M524 96 C548 260 530 440 500 538"/>
<path class="av-cable" d="M478 538 C480 420 470 260 424 200"/>

<!-- casinha em corte -->
<polygon class="av-inside" points="316,170 428,140 428,432 316,432"/>
<polygon class="av-box" points="316,170 428,140 428,214 316,214"/>
<rect class="av-wood" x="428" y="126" width="16" height="394"/>
<rect class="av-wood" x="300" y="164" width="16" height="268"/>
<polygon class="av-woodd" points="282,158 468,108 472,124 286,174"/>
<rect class="av-woodd" x="316" y="214" width="112" height="8"/>

<!-- eletrônica -->
<rect class="av-pi" x="350" y="182" width="58" height="22" rx="2"/>
<rect class="av-box" x="358" y="188" width="11" height="11"/>
<rect class="av-box" x="376" y="190" width="22" height="4"/>
<polygon class="av-cone" points="373,226 336,330 410,330"/>
<rect class="av-cam" x="363" y="206" width="20" height="12" rx="2"/>
<circle class="av-lens" cx="373" cy="224" r="5"/>
<circle class="av-led" cx="346" cy="220" r="3.2"/>
<circle class="av-led" cx="400" cy="220" r="3.2"/>

<!-- frestas -->
<rect class="av-woodd" x="350" y="236" width="8" height="176"/>
<rect class="av-woodd" x="388" y="230" width="8" height="182"/>
<g class="av-bat">
  <use href="#av-hang" transform="translate(333,262)"/>
  <use href="#av-hang" transform="translate(333,312)"/>
  <use href="#av-hang" transform="translate(373,256)"/>
  <use href="#av-hang" transform="translate(412,282)"/>
</g>
<rect class="av-pi" x="366" y="380" width="15" height="10" rx="2"/>

<!-- entrada: barreira IR dupla -->
<rect class="av-box" x="300" y="432" width="16" height="28"/>
<rect class="av-box" x="420" y="432" width="8" height="28"/>
<line class="av-ir" x1="316" y1="440" x2="420" y2="440"/>
<line class="av-ir" x1="316" y1="453" x2="420" y2="453"/>
<line class="av-groove" x1="430" y1="474" x2="440" y2="474"/>
<line class="av-groove" x1="430" y1="486" x2="440" y2="486"/>
<line class="av-groove" x1="430" y1="498" x2="440" y2="498"/>
<line class="av-groove" x1="430" y1="510" x2="440" y2="510"/>

<!-- difusor de essência -->
<rect class="av-woodd" x="276" y="322" width="12" height="8" rx="1"/>
<rect class="av-vial" x="272" y="330" width="20" height="34" rx="5"/>
<path class="av-scent" d="M270 316 q-8 -10 0 -20 q8 -10 0 -20"/>
<path class="av-scent" d="M284 312 q-8 -10 0 -20 q8 -10 0 -20"/>

<!-- morcegos voando -->
<g class="av-bat">
  <use href="#av-fly" transform="translate(372,560) rotate(-14) scale(1.35)"/>
  <use href="#av-fly" transform="translate(196,130) rotate(8) scale(.9)"/>
</g>

<!-- legendas (telas largas) -->
<g class="av-labels">
  <line class="av-lead" x1="638" y1="80" x2="656" y2="72"/><circle class="av-dot" cx="638" cy="80" r="2.5"/>
  <text class="av-lbl" x="662" y="70">Painel solar</text>
  <text class="av-sub" x="662" y="88">carrega a bateria de dia</text>

  <polyline class="av-lead" points="408,192 520,170 656,170"/><circle class="av-dot" cx="408" cy="192" r="2.5"/>
  <text class="av-lbl" x="662" y="166">Compartimento vedado</text>
  <text class="av-sub" x="662" y="184">Raspberry Pi Zero 2 W</text>

  <polyline class="av-lead" points="384,214 520,244 656,244"/><circle class="av-dot" cx="384" cy="214" r="2.5"/>
  <text class="av-lbl" x="662" y="240">Câmera NoIR</text>
  <text class="av-sub" x="662" y="258">+ LEDs infravermelhos 940 nm</text>

  <polyline class="av-lead" points="412,330 656,330"/><circle class="av-dot" cx="412" cy="330" r="2.5"/>
  <text class="av-lbl" x="662" y="326">Frestas de cerca de 2 cm</text>
  <text class="av-sub" x="662" y="344">formato ainda em teste</text>

  <polyline class="av-lead" points="424,446 540,420 656,420"/><circle class="av-dot" cx="424" cy="446" r="2.5"/>
  <text class="av-lbl" x="662" y="416">Barreira IR dupla</text>
  <text class="av-sub" x="662" y="434">conta entradas e saídas</text>

  <polyline class="av-lead" points="442,496 656,496"/><circle class="av-dot" cx="442" cy="496" r="2.5"/>
  <text class="av-lbl" x="662" y="492">Tábua de pouso</text>
  <text class="av-sub" x="662" y="510">ranhurada, para agarrar</text>

  <polyline class="av-lead" points="518,557 656,552"/><circle class="av-dot" cx="518" cy="557" r="2.5"/>
  <text class="av-lbl" x="662" y="548">Bateria separada</text>
  <text class="av-sub" x="662" y="566">o calor fica longe dos morcegos</text>

  <polyline class="av-lead" points="457,608 656,608"/><circle class="av-dot" cx="457" cy="608" r="2.5"/>
  <text class="av-lbl" x="662" y="604">Poste de 3 a 5 m</text>
  <text class="av-sub" x="662" y="622">longe de predadores</text>

  <polyline class="av-lead" points="294,168 244,214"/><circle class="av-dot" cx="294" cy="168" r="2.5"/>
  <text class="av-lbl" x="236" y="218" text-anchor="end">Telhado com beiral</text>
  <text class="av-sub" x="236" y="236" text-anchor="end">protege da chuva e do sol</text>

  <polyline class="av-lead" points="270,348 244,348"/><circle class="av-dot" cx="270" cy="348" r="2.5"/>
  <text class="av-lbl" x="236" y="344" text-anchor="end">Difusor de essência</text>
  <text class="av-sub" x="236" y="362" text-anchor="end">cheiro das plantas que eles comem</text>

  <polyline class="av-lead" points="366,386 300,412 244,412"/><circle class="av-dot" cx="366" cy="386" r="2.5"/>
  <text class="av-lbl" x="236" y="408" text-anchor="end">Sensor de temperatura</text>
  <text class="av-sub" x="236" y="426" text-anchor="end">e umidade dentro do abrigo</text>
</g>

<!-- números (telas estreitas) -->
<g class="av-num" aria-hidden="true">
  <g transform="translate(612,112)"><circle r="14"/><text>1</text></g>
  <g transform="translate(276,150)"><circle r="14"/><text>2</text></g>
  <g transform="translate(424,176)"><circle r="14"/><text>3</text></g>
  <g transform="translate(330,232)"><circle r="14"/><text>4</text></g>
  <g transform="translate(412,350)"><circle r="14"/><text>5</text></g>
  <g transform="translate(252,348)"><circle r="14"/><text>6</text></g>
  <g transform="translate(373,400)"><circle r="14"/><text>7</text></g>
  <g transform="translate(368,474)"><circle r="14"/><text>8</text></g>
  <g transform="translate(470,496)"><circle r="14"/><text>9</text></g>
  <g transform="translate(540,557)"><circle r="14"/><text>10</text></g>
  <g transform="translate(430,610)"><circle r="14"/><text>11</text></g>
</g>
</svg>
